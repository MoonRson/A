<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>数据上传测试</title>
</head>
<body>
  <h2>数据上传测试</h2>
  <input type="text" id="userName" placeholder="输入姓名">
  <button onclick="uploadData()">点击上传</button>
  <p id="result"></p>

  <script>
    // ⚠️ 把下面的地址改成你的云函数公网地址（必须保留 /api/upload）
    const API_URL = 'https://1257886526-lshb3huv01.ap-guangzhou.tencentscf.com/api/upload';

    async function uploadData() {
      const name = document.getElementById('userName').value;
      if (!name) {
        alert('请输入姓名');
        return;
      }
      const data = { username: name, time: new Date().toLocaleString() };

      try {
        const response = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        document.getElementById('result').innerHTML = '✅ ' + JSON.stringify(result);
      } catch (error) {
        document.getElementById('result').innerHTML = '❌ 请求失败: ' + error.message;
      }
    }
  </script>
</body>
</html>
