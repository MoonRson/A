<script>
"use strict";
/* ============================================================
 * 兼容垫片：老浏览器没有 ctx.roundRect 时自动补上
 * （此前「画面冻结」的主因：该方法缺失导致绘制抛错、动画循环中断）
 * ============================================================ */
if (typeof CanvasRenderingContext2D !== 'undefined' && !CanvasRenderingContext2D.prototype.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    const rad = (typeof r === 'number') ? Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2) : 0;
    this.moveTo(x + rad, y);
    this.arcTo(x + w, y, x + w, y + h, rad);
    this.arcTo(x + w, y + h, x, y + h, rad);
    this.arcTo(x, y + h, x, y, rad);
    this.arcTo(x, y, x + w, y, rad);
    this.closePath();
    return this;
  };
}

/* ==================== 共享工具 ==================== */
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmtTime = s => {
  s = Math.floor(s);
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  return h > 0 ? `${h}小时${m}分` : (m > 0 ? `${m}分${sec}秒` : `${sec}秒`);
};
function makePoly(r, n, jit) {
  const v = [];
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2, rr = r * (1 - jit / 2 + Math.random() * jit);
    v.push([Math.cos(a) * rr, Math.sin(a) * rr]);
  }
  return v;
}
function wavyLine(g, y, amp, color) {
  g.strokeStyle = color; g.lineWidth = 5; g.beginPath();
  for (let x = 0; x <= LW; x += 24) {
    const yy = y + Math.sin(x * .045 + y * 1.7) * amp;
    x === 0 ? g.moveTo(x, yy) : g.lineTo(x, yy);
  }
  g.stroke();
}

/* ==================== 黄金矿工：数据 ==================== */
const LW = 720, LH = 1280;
const GROUND_Y = 210;
const PV = { x: 360, y: 148 };
const HOOK_MIN = 36;
const BASE_LEN = 900, ROPE_ADD = 95, LEN_CAP = 1116;

  start() {
    if (this.running || this.destroyed) return;
    this.running = true; this._last = performance.now();
    this._boundLoop = this._boundLoop || this._loop.bind(this);

  }
  stop() {
    this.running = false;
    if (this.rafId) { cancelAnimationFrame(this.rafId); this.rafId = null; }
  }

    if (this.destroyed) return;

    this._ls.length = 0;

    ctx.fillStyle = '#e8a15f'; ctx.beginPath(); ctx.arc(hx + 12, hy + 1, 4.5, 0, 7); ctx.fill();
    ctx.strokeStyle = ctx.fillStyle = '#3a2410'; ctx.lineWidth = 2.4;
    const look = clamp(Math.sin(this.angle) * 2, -2, 2);
    if (this.blinkT > 0) {
      ctx.beginPath(); ctx.moveTo(hx + 1, hy - 4); ctx.lineTo(hx + 6, hy - 4);
      ctx.moveTo(hx + 9, hy - 4); ctx.lineTo(hx + 14, hy - 4); ctx.stroke();
    } else if (strain) {
      ctx.beginPath(); ctx.moveTo(hx + 1, hy - 6); ctx.lineTo(hx + 6, hy - 2); ctx.lineTo(hx + 1, hy + 2);
      ctx.moveTo(hx + 14, hy - 6); ctx.lineTo(hx + 9, hy - 2); ctx.lineTo(hx + 14, hy + 2); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(hx + 4 + look, hy - 4, 2.2, 0, 7); ctx.arc(hx + 12 + look, hy - 4, 2.2, 0, 7); ctx.fill();
    }
    if (strain) {
      ctx.fillStyle = '#8ed4ff';
      ctx.beginPath(); ctx.arc(hx - 16, hy - 8 + Math.sin(this.Ta * 9) * 2, 3.2, 0, 7); ctx.fill();
    }
    ctx.fillStyle = SK.helmet;
    ctx.beginPath(); ctx.arc(hx, hy - 4, 16, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.roundRect(hx - 19, hy - 7, 38, 5, 3); ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(hx, hy - 4, 16, Math.PI, 0); ctx.stroke();
    ctx.fillStyle = '#8d8d94'; ctx.fillRect(hx + 10, hy - 18, 8, 8);
    const lg = ctx.createRadialGradient(hx + 16, hy - 14, 2, hx + 16, hy - 14, 24);
    lg.addColorStop(0, 'rgba(255,240,170,.75)'); lg.addColorStop(1, 'rgba(255,240,170,0)');
    ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(hx + 16, hy - 14, 24, 0, 7); ctx.fill();
    const hxk = PV.x + Math.cos(this.crankRot) * 19, hyk = PV.y + Math.sin(this.crankRot) * 19;
    ctx.strokeStyle = SK.shirt; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(mx + 13, hipY - 32 + bob * .4);
    ctx.quadraticCurveTo(mx + 34, hipY - 52, hxk, hyk); ctx.stroke();
    ctx.fillStyle = '#ffd9b0'; ctx.beginPath(); ctx.arc(hxk, hyk, 5.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#8a5a2e'; ctx.beginPath(); ctx.arc(PV.x, PV.y, 24, 0, 7); ctx.fill();
    ctx.strokeStyle = '#4a2d14'; ctx.lineWidth = 5; ctx.stroke();
    ctx.lineWidth = 4;
    for (let i = 0; i < 4; i++) {
      const a = this.crankRot + i * Math.PI / 2;
      ctx.beginPath(); ctx.moveTo(PV.x + Math.cos(a) * 5, PV.y + Math.sin(a) * 5);
      ctx.lineTo(PV.x + Math.cos(a) * 20, PV.y + Math.sin(a) * 20); ctx.stroke();
    }
    ctx.fillStyle = '#3d2410'; ctx.beginPath(); ctx.arc(PV.x, PV.y, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd23f'; ctx.beginPath(); ctx.arc(hxk, hyk, 4.5, 0, 7); ctx.fill();
  }
  _drawClaw(tp) {
    const ctx = this.ctx;
    ctx.save(); ctx.translate(tp.x, tp.y); ctx.rotate(-this.angle);
    const o = .35 + this.clawOpen * .85;
    ctx.lineCap = 'round';
    for (const s of [-1, 1]) {
      ctx.save(); ctx.rotate(s * o);
      ctx.strokeStyle = '#3f444c'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(s * 2, 14, s * 11, 22); ctx.stroke();
      ctx.strokeStyle = '#9aa3ad'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(0, 2); ctx.quadraticCurveTo(s * 2, 14, s * 11, 22); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#6d4c2f'; ctx.beginPath(); ctx.arc(0, 0, 6, 0, 7); ctx.fill();
    ctx.strokeStyle = '#3d2410'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
  _drawParticles() {
    const ctx = this.ctx;
    for (const p of this.particles) {
      if (p.type === 'spark') {
        ctx.globalAlpha = 1 - p.t / p.life;
        ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
      } else if (p.type === 'coin' && p.t >= p.delay) {
        ctx.fillStyle = '#ffd94a'; ctx.beginPath(); ctx.arc(p.x, p.y, 7, 0, 7); ctx.fill();
        ctx.strokeStyle = '#a3690a'; ctx.lineWidth = 2; ctx.stroke();
        ctx.fillStyle = 'rgba(255,255,255,.85)'; ctx.beginPath(); ctx.arc(p.x - 2, p.y - 2, 2, 0, 7); ctx.fill();
      } else if (p.type === 'rain') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(this.Ta * 4 + p.sway);
        ctx.fillStyle = '#ffd94a'; ctx.fillRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2);
        ctx.strokeStyle = '#a3690a'; ctx.lineWidth = 1.5; ctx.strokeRect(-p.r, -p.r * .6, p.r * 2, p.r * 1.2);
        ctx.restore();
      } else if (p.type === 'ring') {
        ctx.globalAlpha = 1 - p.t / .4;
        ctx.strokeStyle = '#ffd9a0'; ctx.lineWidth = 6;
        ctx.beginPath(); ctx.arc(p.x, p.y, 12 + p.t * 320, 0, 7); ctx.stroke();
      }
      ctx.globalAlpha = 1;
    }
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    for (const p of this.popups) {
      ctx.globalAlpha = clamp(1.25 - p.t, 0, 1);
      ctx.font = '900 30px "Yuanti SC","YouYuan","Microsoft YaHei",sans-serif';
      ctx.strokeStyle = 'rgba(30,14,2,.9)'; ctx.lineWidth = 6; ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.color; ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
  }
  _draw() {
    const ctx = this.ctx;
    ctx.setTransform(this.vs, 0, 0, this.vs, 0, 0);
    if (this.shake > 0) ctx.translate(rnd(-this.shake, this.shake), rnd(-this.shake, this.shake));
    ctx.drawImage(this.bgCv, 0, 0);
    for (const c of this.clouds) this._drawCloud(c);
    ctx.fillStyle = 'rgba(255,230,180,.14)';
    for (const d of this.dust) { ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fill(); }
    this._drawAutoMarker();
    for (const o of this.objects) this._drawObj(o);
    const tp = this.tipPos();
    if (this.buffs.magnet > 0) {
      ctx.strokeStyle = `rgba(120,215,255,${.25 + .15 * Math.sin(this.Ta * 6)})`;
      ctx.lineWidth = 2; ctx.setLineDash([6, 8]);
      ctx.beginPath(); ctx.arc(tp.x, tp.y, 110, 0, 7); ctx.stroke();
      ctx.setLineDash([]);
    }
    if (this.buffs.swift > 0 && this.state === 'retract') {
      const g = ctx.createRadialGradient(tp.x, tp.y, 2, tp.x, tp.y, 40);
      g.addColorStop(0, 'rgba(255,226,122,.5)'); g.addColorStop(1, 'rgba(255,226,122,0)');
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(tp.x, tp.y, 40, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = '#4a2d14'; ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.moveTo(PV.x, PV.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
    ctx.strokeStyle = '#a97c48'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(PV.x, PV.y); ctx.lineTo(tp.x, tp.y); ctx.stroke();
    if (this.grabbed) { ctx.save(); ctx.translate(this.grabbed.x, this.grabbed.y); ctx.rotate(Math.sin(this.T * 5) * .07); ctx.translate(-this.grabbed.x, -this.grabbed.y); this._drawObj(this.grabbed); ctx.restore(); }
    this._drawClaw(tp);
    this._drawMiner();
    this._drawParticles();
    if (this.feverT > 0) {
      const a = 0.10 + 0.05 * Math.sin(this.Ta * 6);
      const g = ctx.createRadialGradient(360, 640, 200, 360, 640, 900);
      g.addColorStop(0, 'rgba(255,200,60,0)'); g.addColorStop(1, `rgba(255,170,30,${a})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
    }
  }
  updateGoldUI() {
    const t = this.gold.toLocaleString('zh-CN');
    this.el.goldNum.textContent = t; this.el.shopGold.textContent = t;
  }
  updateBombUI() {
    this.el.bagNum.textContent = this.dynamite; this.el.bombCnt.textContent = this.dynamite;
    this.el.bombBtn.classList.toggle('empty', this.dynamite <= 0);
  }
  updateLayerChip() {
    this.el.layerChip.textContent = this.objects.length === 0
      ? `⛏️ ${this.layer}层 · 掘进中…`
      : `⛏️ ${this.layer}层 · 剩${this.objects.length}件 · ×${this.valueMult().toFixed(1)}`;
  }
  banner(main, sub = '') {
    const b = this.el.bannerEl;
    this.el.bMain.textContent = main; this.el.bSub.textContent = sub;
    b.classList.remove('show'); void b.offsetWidth; b.classList.add('show');
  }
  showToast(html) {
    const w = this.el.toastWrap, t = document.createElement('div');
    t.className = 'toast'; t.innerHTML = html;
    w.appendChild(t);
    while (w.children.length > 3) w.removeChild(w.firstChild);
    setTimeout(() => t.remove(), 2750);
  }
  _updateBombBtn() {
    const show = this.state === 'retract' && !!this.grabbed && this.started && !this.shopOpen && !this.helpOpen && !this.musicOpen && !this.achOpen;
    this.el.bombBtn.classList.toggle('show', show);
    this.el.bombBtn.classList.toggle('urgent', !!(this.grabbed && this.grabbed.weight >= 11) && this.dynamite > 0);
  }
  _updateFeverBar() {
    const on = this.feverT > 0;
    this.el.feverBar.classList.toggle('show', on);
    if (on) this.el.feverFill.style.width = (this.feverT / FEVER_TIME * 100) + '%';
  }
  _updateStatusBar() {
    const E = this.el;
    E.stAuto.classList.toggle('show', this.autoOn && this.started);
    const hasEv = this.started && this.layerEvent !== 'calm';
    E.stEvent.classList.toggle('show', hasEv);
    if (hasEv) { E.stEvent.textContent = EVENT_LABEL[this.layerEvent]; E.stEvent.className = 'st-chip st-event show ' + this.layerEvent; }
    E.stMagnet.classList.toggle('show', this.buffs.magnet > 0);
    if (this.buffs.magnet > 0) E.stMagnet.querySelector('b').textContent = Math.ceil(this.buffs.magnet) + 's';
    E.stSwift.classList.toggle('show', this.buffs.swift > 0);
    if (this.buffs.swift > 0) E.stSwift.querySelector('b').textContent = Math.ceil(this.buffs.swift) + 's';
    E.stFever.classList.toggle('show', this.feverT > 0);
    if (this.feverT > 0) E.stFever.querySelector('b').textContent = Math.ceil(this.feverT) + 's';
  }
  _shopDefs() {
    return [
      { id: 'dynamite', icon: '🧨', name: '炸药', desc: '回收途中使用，立刻丢弃钩住的物体',
        lvTxt: () => '消耗品', stat: () => `背包剩余 ${this.dynamite} 枚`, cost: () => Math.round(50 * Math.pow(1.18, this.up.dynBuy)) },
      { id: 'strength', icon: '💪', name: '力量药剂', desc: '钩子回收速度永久 +10% / 级 · Lv.3 可拉动巨岩',
        lvTxt: () => `Lv.${this.up.strength}`, stat: () => `当前加成 +${this.up.strength * 10}%${this.up.strength >= BOSS_NEED_STR ? ' · 已可拉巨岩' : ''}`, cost: () => Math.round(150 * Math.pow(1.55, this.up.strength)) },
      { id: 'luck', icon: '🍀', name: '幸运草', desc: '提升大金块与钻石的出现概率',
        lvTxt: () => `Lv.${this.up.luck}`, stat: () => `稀有概率 ×${(1 + .35 * this.up.luck).toFixed(2)}`, cost: () => Math.round(200 * Math.pow(1.6, this.up.luck)) },
      { id: 'rope', icon: '🪢', name: '加长绳索', desc: '增加钩子最大长度，够到更深的矿层',
        lvTxt: () => `Lv.${this.up.rope}`, stat: () => `绳长 ${Math.min(BASE_LEN + this.up.rope * ROPE_ADD, LEN_CAP)} / ${LEN_CAP}`, cost: () => Math.round(100 * Math.pow(1.5, this.up.rope)) },
    ];
  }
  _buildShop() {
    this._shopDefs().forEach(cfg => {
      const row = document.createElement('div');
      row.className = 'item'; row.id = 'item_' + cfg.id;
      row.innerHTML = `
        <div class="iicon">${cfg.icon}</div>
        <div class="iinfo">
          <div class="iname">${cfg.name}<span class="lv" data-lv></span></div>
          <div class="idesc">${cfg.desc}</div>
          <div class="istat" data-stat></div>
        </div>
        <button class="gold-btn small" data-buy></button>`;
      row.querySelector('[data-buy]').addEventListener('click', () => this.buy(cfg.id));
      this.el.shopList.appendChild(row);
    });
  }
  refreshShop() {
    for (const cfg of this._shopDefs()) {
      const row = this.container.querySelector('#item_' + cfg.id); if (!row) continue;
      row.querySelector('[data-lv]').textContent = cfg.lvTxt();
      row.querySelector('[data-stat]').textContent = cfg.stat();
      const btn = row.querySelector('[data-buy]');
      const maxed = cfg.id === 'rope' && BASE_LEN + this.up.rope * ROPE_ADD >= LEN_CAP;
      if (maxed) { btn.textContent = '已至最深处'; btn.disabled = true; }
      else { btn.textContent = '🪙 ' + cfg.cost(); btn.disabled = this.gold < cfg.cost(); }
    }
    this.refreshSkinShop();
  }
  buy(id) {
    const cfg = this._shopDefs().find(c => c.id === id);
    const cost = cfg.cost();
    if (id === 'rope' && BASE_LEN + this.up.rope * ROPE_ADD >= LEN_CAP) return;
    if (this.gold < cost) { this.sndDeny(); return; }
    this.gold -= cost;
    if (id === 'dynamite') { this.dynamite++; this.up.dynBuy++; }
    else this.up[id]++;
    this.sndBuy(); this.updateGoldUI(); this.refreshShop(); this._saveGame();
  }
  _buildSkinShop() {
    SKINS.forEach(s => {
      const card = document.createElement('div');
      card.className = 'skin-card'; card.id = 'skin_' + s.id;
      card.innerHTML = `
        <div class="skin-prev" style="background:linear-gradient(180deg,${s.helmet} 0 42%,${s.shirt} 42% 72%,${s.pants} 72%)"></div>
        <div class="skin-name">${s.name}</div>
        <button class="gold-btn tiny" data-skinbtn></button>`;
      card.addEventListener('click', () => this.skinAction(s.id));
      this.el.skinGrid.appendChild(card);
    });
  }
  skinAction(id) {
    const s = SKINS.find(x => x.id === id);
    if (!this.ownedSkins.includes(id)) {
      if (this.gold < s.price) { this.sndDeny(); return; }
      this.gold -= s.price; this.stats.skinsBought++;
      this.ownedSkins.push(id); this.currentSkin = id;
      this.sndBuy(); this.updateGoldUI(); this.refreshShop(); this.checkAch();
    } else { this.currentSkin = id; this.sndClick(); }
    this.refreshSkinShop(); this._saveGame();
  }
  refreshSkinShop() {
    for (const s of SKINS) {
      const elC = this.container.querySelector('#skin_' + s.id); if (!elC) continue;
      const btn = elC.querySelector('[data-skinbtn]');
      const owned = this.ownedSkins.includes(s.id), cur = this.currentSkin === s.id;
      elC.classList.toggle('current', cur);
      if (cur) { btn.textContent = '✔ 使用中'; btn.disabled = true; }
      else if (owned) { btn.textContent = '装备'; btn.disabled = false; }
      else { btn.textContent = '🪙 ' + s.price; btn.disabled = this.gold < s.price; }
    }
  }
  checkAch() {
    if (this.achLock) return;
    this.achLock = true;
    for (const a of ACHS) {
      if (!this.achUnlocked.has(a.id) && a.check(this.stats)) {
        this.achUnlocked.add(a.id);
        this.gold += a.reward; this.stats.goldEarned += a.reward;
        this.updateGoldUI(); this.refreshShop();
        this.showToast(`🏆 成就达成：${a.name} <b style="color:#ffd94a">+${a.reward} 🪙</b>`);
        this.sndAch(); this.vib(30);
      }
    }
    this.achLock = false;
    if (this.achOpen) this.refreshAchPanel();
  }
  refreshAchPanel() {
    this.el.achCount.textContent = `已解锁 ${this.achUnlocked.size} / ${ACHS.length}`;
    this.el.statGrid.innerHTML = [
      ['累计金币', this.stats.goldEarned.toLocaleString('zh-CN')], ['总抓取', this.stats.catches],
      ['最高连击', '×' + this.stats.bestCombo], ['最深矿层', '第 ' + this.stats.maxLayer + ' 层'],
      ['钻石', this.stats.diamonds], ['神秘福袋', this.stats.bags],
      ['巨岩矿核', this.stats.bosses], ['炸药使用', this.stats.dynUsed], ['游戏时长', fmtTime(this.stats.playTime)],
    ].map(([k, v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`).join('');
    this.el.achList.innerHTML = ACHS.map(a => {
      const un = this.achUnlocked.has(a.id);
      return `<div class="arow ${un ? '' : 'locked'}">
        <div class="aico">${un ? '🏆' : '🔒'}</div>
        <div class="ainfo"><div class="aname">${a.name}</div><div class="adesc">${a.desc}</div></div>
        <div class="arw">+${a.reward}🪙</div></div>`;
    }).join('');
  }
  _saveGame() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify({
        v: 1, gold: this.gold, dynamite: this.dynamite, layer: this.layer, up: this.up, stats: this.stats,
        ach: [...this.achUnlocked], ownedSkins: this.ownedSkins, currentSkin: this.currentSkin,
        musicTrack: this.music.trackIdx >= 3 ? 0 : this.music.trackIdx, musicVol: this.music.vol,
      }));
    } catch (e) {}
  }
  _loadGame() {
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (!raw) return;
      const d = JSON.parse(raw);
      if (typeof d.gold === 'number') this.gold = Math.max(0, d.gold);
      if (typeof d.dynamite === 'number') this.dynamite = Math.max(0, d.dynamite);
      if (typeof d.layer === 'number') this.layer = Math.max(1, d.layer);
      if (d.up) Object.assign(this.up, d.up);
      if (d.stats) Object.assign(this.stats, d.stats);
      if (Array.isArray(d.ach)) this.achUnlocked = new Set(d.ach);
      if (Array.isArray(d.ownedSkins) && d.ownedSkins.length)
        this.ownedSkins = d.ownedSkins.filter(id => SKINS.some(s => s.id === id));
      if (!this.ownedSkins.includes('classic')) this.ownedSkins.push('classic');
      if (d.currentSkin && this.ownedSkins.includes(d.currentSkin)) this.currentSkin = d.currentSkin;
      if (typeof d.musicVol === 'number') this.music.vol = clamp(d.musicVol, 0, 1);
      if (typeof d.musicTrack === 'number') this.musicWant = d.musicTrack;
    } catch (e) {}
  }
  openShop()  { if (!this.started) return; this.shopOpen = true; this.refreshShop(); this.el.shopPanel.classList.add('show'); this.el.shopBack.classList.add('show'); this.sndClick(); }
  closeShop() { this.shopOpen = false; this.el.shopPanel.classList.remove('show'); this.el.shopBack.classList.remove('show'); this.sndClick(); }
  openHelp()  { this.helpOpen = true; this.el.helpPanel.classList.add('show'); this.el.helpBack.classList.add('show'); this.sndClick(); }
  closeHelp() { this.helpOpen = false; this.el.helpPanel.classList.remove('show'); this.el.helpBack.classList.remove('show'); this.sndClick(); }
  openMusic() { this.musicOpen = true; this.refreshMusicPanel(); this.el.musicPanel.classList.add('show'); this.el.musicBack.classList.add('show'); this.sndClick(); }
  closeMusic(){ this.musicOpen = false; this.el.musicPanel.classList.remove('show'); this.el.musicBack.classList.remove('show'); this.sndClick(); }
  openAch()   { this.achOpen = true; this.resetArm = false; this.el.resetBtn.textContent = '🗑️ 清除存档（重新开始）';
    this.refreshAchPanel(); this.el.achPanel.classList.add('show'); this.el.achBack.classList.add('show'); this.sndClick(); }
  closeAch()  { this.achOpen = false; this.el.achPanel.classList.remove('show'); this.el.achBack.classList.remove('show'); this.sndClick(); }
  toggleAuto() {
    if (!this.started) return;
    this.autoOn = !this.autoOn;
    if (this.autoOn) this.stats.autoUsed = 1;
    this.el.autoBtn.classList.toggle('on', this.autoOn);
    this.el.autoBtn.textContent = this.autoOn ? '🤖 自动：开' : '🤖 自动：关';
    this.sndClick(); this.checkAch();
    if (this.autoOn) this.banner('🤖 自动挖掘已开启', 'AI 会瞄准性价比最高的矿宝 · 再点按钮可接管');
  }
}

  /* ============ 每日任务 ============ */
  _today() { const d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  _rollDaily() {
    const date = this._today();
    let seed = 0;
    for (let i = 0; i < date.length; i++) seed = (seed * 31 + date.charCodeAt(i)) % 99991;
    const rng = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    const types = ['total', 'type', 'item', 'big', 'large'];
    for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; }
    const ms = [];
    for (const t of types.slice(0, 3)) {
      if (t === 'total') ms.push({ type: t, target: 20 + Math.floor(rng() * 3) * 10, prog: 0, done: false });
      else if (t === 'type') {
        const ids = ['clown', 'tropic', 'puffer', 'lantern', 'squid', 'jelly', 'sword', 'turtle'];
        ms.push({ type: t, param: ids[Math.floor(rng() * ids.length)], target: 4 + Math.floor(rng() * 3), prog: 0, done: false });
      }
      else if (t === 'item') ms.push({ type: t, target: 2 + Math.floor(rng() * 2), prog: 0, done: false });
      else if (t === 'big') ms.push({ type: t, target: (3 + Math.floor(rng() * 3)) * 100, prog: 0, done: false });

  _dailyDesc(m) {

    if (m.type === 'item') return `使用道具 ${m.target} 次`;
    if (m.type === 'big') return `单次捕获 ≥ ${m.target} 金币`;

      else if (m.type === 'type' && m.param === id) inc = 1;
      else if (m.type === 'large' && ['turtle', 'ray', 'shark'].includes(id)) inc = 1;
      else if (m.type === 'big' && reward >= m.target) m.prog = m.target;
      if (inc) m.prog = Math.min(m.target, m.prog + inc);
      if (m.prog >= m.target) m.done = true;

  /* ============ 主更新 ============ */

    if (this.shakeT > 0) this.shakeT = Math.max(0, this.shakeT - dt);
    if (this.freezeT > 0) this.freezeT = Math.max(0, this.freezeT - dt);
    if (this.speedT > 0) this.speedT = Math.max(0, this.speedT - dt);

    if (this.flashT > 0) this.flashT = Math.max(0, this.flashT - dt * 2.2);

    // —— 🌊 鱼潮 ——
    this.tideT -= dt;

        case 'jelly': {
          const r = f.r, pu = 1 + Math.sin(this.T * 3 + f.seed) * .08;
          ctx.globalAlpha = .85;
          const g = ctx.createRadialGradient(0, -r * .2, r * .1, 0, 0, r);
          g.addColorStop(0, '#bfe8ff'); g.addColorStop(.6, '#6fc3f0'); g.addColorStop(1, '#3f8fd0');
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.arc(0, 0, r * .85 * pu, Math.PI, 0);
          ctx.quadraticCurveTo(r * .4 * pu, r * .3, 0, r * .25);
          ctx.quadraticCurveTo(-r * .4 * pu, r * .3, -r * .85 * pu, 0);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(159,216,246,.8)'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.strokeStyle = 'rgba(159,216,246,.75)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
          for (let k = -2; k <= 2; k++) {
            ctx.beginPath(); ctx.moveTo(k * r * .28, r * .2);
            ctx.quadraticCurveTo(k * r * .3 + sway * 5, r * .7, k * r * .34 + sway * 8, r * 1.15);
            ctx.stroke();
          }
          ctx.globalAlpha = 1;
          break;
        }
        case 'sword': {
          const r = f.r;
          ctx.fillStyle = '#4a90c9';
          ctx.beginPath(); ctx.ellipse(0, 0, r, r * .34, 0, 0, 7); ctx.fill();
          ctx.strokeStyle = '#2a5a86'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.fillStyle = '#cfe6f5'; ctx.beginPath(); ctx.ellipse(r * .1, r * .12, r * .7, r * .16, 0, 0, 7); ctx.fill();
          ctx.fillStyle = '#2a5a86';
          ctx.beginPath(); ctx.moveTo(r * .9, -r * .06); ctx.lineTo(r * 1.8, 0); ctx.lineTo(r * .9, r * .06); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#4a90c9';
          ctx.beginPath(); ctx.moveTo(-r * .1, -r * .3); ctx.lineTo(r * .15, -r * .85); ctx.lineTo(r * .4, -r * .28); ctx.closePath(); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-r * .95, 0); ctx.lineTo(-r * 1.4, -r * .4 + sway * 3); ctx.lineTo(-r * 1.4, r * .4 + sway * 3); ctx.closePath(); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * .62, -r * .1, 4, 0, 7); ctx.fill();
          ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(r * .68, -r * .1, 2, 0, 7); ctx.fill();
          break;
        }
        case 'turtle': {
          ctx.fillStyle = '#5da83f';
          ctx.beginPath(); ctx.ellipse(-f.r * .2, -f.r * .75, f.r * .42, f.r * .2, -.6, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.ellipse(-f.r * .2, f.r * .75, f.r * .42, f.r * .2, .6, 0, 7); ctx.fill();
          ctx.fillStyle = '#7ec850'; ctx.beginPath(); ctx.arc(f.r * .95, 0, f.r * .32, 0, 7); ctx.fill();
          ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(f.r * 1.05, -f.r * .08, 2.5, 0, 7); ctx.fill();
          ctx.fillStyle = '#3e7a2e';
          ctx.beginPath(); ctx.ellipse(0, 0, f.r, f.r * .72, 0, 0, 7); ctx.fill();
          ctx.strokeStyle = '#2c5a20'; ctx.lineWidth = 3; ctx.stroke();
          ctx.strokeStyle = '#7ec850'; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.ellipse(0, 0, f.r * .62, f.r * .42, 0, 0, 7); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-f.r * .62, 0); ctx.lineTo(f.r * .62, 0);
          ctx.moveTo(0, -f.r * .42); ctx.lineTo(0, f.r * .42); ctx.stroke();
          break;
        }
        case 'ray': {
          const r = f.r, flap = Math.sin(this.T * 3.2 + f.seed) * .25;
          ctx.fillStyle = '#8a6fc9';
          ctx.beginPath();
          ctx.moveTo(r * .75, 0);
          ctx.quadraticCurveTo(r * .2, -r * (0.75 + flap), -r * .6, -r * .15);
          ctx.quadraticCurveTo(-r * .3, 0, -r * .6, r * .15);
          ctx.quadraticCurveTo(r * .2, r * (0.75 + flap), r * .75, 0);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#5a4490'; ctx.lineWidth = 3; ctx.stroke();
          ctx.strokeStyle = '#5a4490'; ctx.lineWidth = 3.5; ctx.lineCap = 'round';
          ctx.beginPath(); ctx.moveTo(-r * .55, 0); ctx.quadraticCurveTo(-r * 1.1, sway * 8, -r * 1.5, sway * 14); ctx.stroke();
          ctx.fillStyle = '#c9b8f0';
          ctx.beginPath(); ctx.arc(r * .15, -r * .15, r * .09, 0, 7); ctx.arc(r * .15, r * .15, r * .09, 0, 7); ctx.fill();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * .55, -r * .06, 4.5, 0, 7); ctx.fill();
          ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(r * .6, -r * .06, 2.2, 0, 7); ctx.fill();
          break;
        }
        case 'shark': {
          const r = f.r;
          ctx.fillStyle = '#9fb6c6';
          ctx.beginPath(); ctx.ellipse(0, 0, r, r * .42, 0, 0, 7); ctx.fill();
          ctx.strokeStyle = '#5a7386'; ctx.lineWidth = 3; ctx.stroke();
          ctx.fillStyle = '#e8f1f6';
          ctx.beginPath(); ctx.ellipse(r * .1, r * .16, r * .72, r * .2, 0, 0, 7); ctx.fill();
          ctx.fillStyle = '#9fb6c6';
          ctx.beginPath(); ctx.moveTo(-r * .1, -r * .38); ctx.lineTo(r * .12, -r * .95); ctx.lineTo(r * .34, -r * .36);
          ctx.closePath(); ctx.fill(); ctx.stroke();
          ctx.beginPath(); ctx.moveTo(-r * .9, 0);
          ctx.lineTo(-r * 1.45, -r * .6 + sway * 6); ctx.lineTo(-r * 1.2, 0); ctx.lineTo(-r * 1.45, r * .45 + sway * 6);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#5a7386'; ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(r * .3, -r * .18); ctx.lineTo(r * .26, r * .14);
          ctx.moveTo(r * .42, -r * .16); ctx.lineTo(r * .38, r * .12);
          ctx.stroke();
          ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(r * .62, -r * .12, 3.4, 0, 7); ctx.fill();
          ctx.strokeStyle = '#5a7386'; ctx.lineWidth = 2.5;
          ctx.beginPath(); ctx.moveTo(r * .98, r * .05); ctx.quadraticCurveTo(r * .7, r * .22, r * .45, r * .16); ctx.stroke();
          break;
        }
        case 'arowana': {
          const r = f.r;
          const g = ctx.createRadialGradient(0, 0, 2, 0, 0, r * 2);
          g.addColorStop(0, 'rgba(255,226,122,.5)'); g.addColorStop(1, 'rgba(255,226,122,0)');
          ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, r * 2, 0, 7); ctx.fill();
          const bg = ctx.createLinearGradient(0, -r * .4, 0, r * .4);
          bg.addColorStop(0, '#ffe98f'); bg.addColorStop(.5, '#f5b62e'); bg.addColorStop(1, '#c98a12');
          ctx.fillStyle = bg;
          ctx.beginPath(); ctx.ellipse(0, 0, r * 1.15, r * .4, 0, 0, 7); ctx.fill();
          ctx.strokeStyle = '#a3690a'; ctx.lineWidth = 2.5; ctx.stroke();
          ctx.strokeStyle = 'rgba(163,105,10,.5)'; ctx.lineWidth = 1.5;
          for (let k = -2; k <= 2; k++) { ctx.beginPath(); ctx.arc(k * r * .35, 0, r * .3, -.9, .9); ctx.stroke(); }
          ctx.fillStyle = '#f5b62e';
          ctx.beginPath(); ctx.moveTo(-r * 1.05, 0); ctx.lineTo(-r * 1.6, -r * .45 + sway * 3); ctx.lineTo(-r * 1.6, r * .45 + sway * 3);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = '#c98a12'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(r * 1.05, -r * .05); ctx.quadraticCurveTo(r * 1.35, -r * .3, r * 1.5, -r * .45); ctx.stroke();
          ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(r * .8, -r * .1, 4, 0, 7); ctx.fill();
          ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(r * .86, -r * .1, 2, 0, 7); ctx.fill();
          break;
        }
        case 'coela': {
          const r = f.r;
          ctx.fillStyle = '#3f5a8a';
          ctx.beginPath(); ctx.ellipse(0, 0, r, r * .6, 0, 0, 7); ctx.fill();
          ctx.strokeStyle = '#243a5e'; ctx.lineWidth = 3; ctx.stroke();
          ctx.fillStyle = '#7fa8d9';
          ctx.beginPath(); ctx.ellipse(r * .1, r * .15, r * .6, r * .28, 0, 0, 7); ctx.fill();
          ctx.fillStyle = '#2e4770';
          ctx.beginPath(); ctx.ellipse(-r * .2, -r * .62, r * .3, r * .14, -.5, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.ellipse(-r * .2, r * .62, r * .3, r * .14, .5, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.ellipse(r * .3, r * .5, r * .22, r * .12, .6, 0, 7); ctx.fill();
          ctx.beginPath(); ctx.moveTo(-r * .9, 0); ctx.lineTo(-r * 1.45, -r * .5 + sway * 4); ctx.lineTo(-r * 1.2, 0); ctx.lineTo(-r * 1.45, r * .4 + sway * 4);
          ctx.closePath(); ctx.fill();
          ctx.strokeStyle = 'rgba(200,220,255,.35)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(-r * .5, -r * .1); ctx.lineTo(r * .5, -r * .1); ctx.stroke();
          ctx.fillStyle = '#ffe98f'; ctx.beginPath(); ctx.arc(r * .6, -r * .15, 5, 0, 7); ctx.fill();
          ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(r * .66, -r * .15, 2.5, 0, 7); ctx.fill();
          break;
        }
      }
    }
    if (f.shiny) {
      ctx.globalAlpha = .3 + .15 * Math.sin(this.T * 6 + f.seed);
      ctx.fillStyle = '#ffd94a';
      ctx.beginPath(); ctx.ellipse(0, 0, f.r * 1.15, f.r * .9, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    if (f.flash > 0 && !f.bottle) {
      ctx.globalAlpha = Math.min(1, f.flash * 6);
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0, 0, f.r * 1.05, f.r * .8, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
    if (!f.bottle && (f.boss || f.id === 'ray' || f.id === 'arowana' || f.id === 'coela')) {
      const w = 110, pct = clamp(f.hp / f.maxHp, 0, 1);
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(f.x - w / 2, f.y + bob - f.r - 24, w, 9);
      ctx.fillStyle = pct > .4 ? '#ff6a5f' : '#ff2e1f';
      ctx.fillRect(f.x - w / 2, f.y + bob - f.r - 24, w * pct, 9);
    }
  }
  /* ============ UI ============ */
  updateGoldUI() {
    this.el.goldNum.textContent = this.gold.toLocaleString('zh-CN');
    this.broke = this.gold < this.curMult();
    this.el.gold.classList.toggle('broke', this.broke);
  }
  updateScoreUI() {
    this.el.catchN.textContent = this.caughtCount;
    this.el.bestN.textContent = this.best.toLocaleString('zh-CN');
  }
  updateMultUI() {
    this.el.multNum.textContent = this.curMult() + '倍';
    this.el.multNum.style.color = FG_BARREL_COLORS[this.multIdx];
  }
  updateItemsUI() {
    for (const k in this.itemBtns) {
      this.itemBtns[k].querySelector('[data-cnt]').textContent = this.items[k];
      this.itemBtns[k].classList.toggle('empty', this.items[k] <= 0);
    }
  }
  _updateItemGlow() {
    const m = { freeze: this.freezeT, speed: this.speedT, aim: this.aimT };
    for (const k in this.itemBtns)
      this.itemBtns[k].classList.toggle('active-buff', !!(m[k] && m[k] > 0));
  }
  toast(msg) {
    const t = document.createElement('div');
    t.className = 'fg-toast'; t.textContent = msg;
    this.el.toastWrap.appendChild(t);
    while (this.el.toastWrap.children.length > 3) this.el.toastWrap.removeChild(this.el.toastWrap.firstChild);
    setTimeout(() => t.remove(), 2600);
  }
  /* ============ 音效 ============ */
  vib(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
  sndInit() { if (this.snd.ctx) return;
    try { this.snd.ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { this.snd.on = false; } }
  sndBeep(f = 440, d = .1, type = 'sine', v = .2, f2 = 0) {
    if (!this.snd.on || !this.snd.ctx) return;
    try {
      const t = this.snd.ctx.currentTime, o = this.snd.ctx.createOscillator(), g = this.snd.ctx.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t);
      if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g).connect(this.snd.ctx.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  }
  sndNoise(d = .35, v = .4, fq = 700) {
    if (!this.snd.on || !this.snd.ctx) return;
    try {
      const c = this.snd.ctx, t = c.currentTime, len = c.sampleRate * d;
      const buf = c.createBuffer(1, len, c.sampleRate), ch = buf.getChannelData(0);
      for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = fq;
      const g = c.createGain(); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      src.connect(f).connect(g).connect(c.destination); src.start(t);
    } catch (e) {}
  }
  sndFire()  { this.sndBeep(460, .1, 'square', .12, 150); }
  sndHit()   { this.sndBeep(200, .06, 'square', .1); }
  sndCatch() { this.sndBeep(988, .08, 'triangle', .16); setTimeout(() => this.sndBeep(1319, .16, 'triangle', .16), 60); }
  sndDeny()  { this.sndBeep(140, .2, 'sawtooth', .12); }
  sndItem()  { this.sndBeep(784, .09, 'triangle', .14); setTimeout(() => this.sndBeep(1175, .14, 'triangle', .14), 70); }
  sndFreeze(){ this.sndBeep(1200, .4, 'sine', .12, 300); }
  sndBoom()  { this.sndNoise(.5, .5, 700); this.sndBeep(80, .5, 'sine', .4, 35); }
  sndAch()   { [660, 880, 1100, 1320].forEach((f, i) => setTimeout(() => this.sndBeep(f, .12, 'triangle', .15), i * 70)); }
  sndTide()  { this.sndBeep(600, .12, 'square', .14); setTimeout(() => this.sndBeep(820, .16, 'square', .14), 140); }
  sndClick() { this.sndBeep(680, .05, 'square', .08); }
}

/* ============================================================
 * GameManager
 * ============================================================ */
const GameManager = {
  current: null,
  titles: { goldminer: '黄金矿工', fishing: '捕鱼达人' },
  showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.toggle('active', s.id === id));
  },
  enter(name) {
    if (!this.titles[name]) return;
    if (this.current) { this.current.destroy(); this.current = null; }
    this.showScreen('game-' + name);
    const nav = document.getElementById('bottom-nav');
    nav.classList.add('show');
    document.getElementById('navTitle').textContent = this.titles[name];
    const container = document.getElementById('game-' + name);
    this.current = name === 'goldminer' ? new GoldMinerGame(container) : new FishingGame(container);
    this.current.start();
  },
  startGame(name) { return this.enter(name); },
  backToLobby() {
    if (this.current) { this.current.destroy(); this.current = null; }
    this.showScreen('lobby');
    document.getElementById('bottom-nav').classList.remove('show');
  },
};

/* ---------------- 大厅 / 导航 初始绑定 ---------------- */
document.querySelectorAll('#lobby [data-game]').forEach(btn => {
  btn.addEventListener('click', () => {
    const g = btn.dataset.game;
    if (GameManager.titles[g]) GameManager.enter(g);
  });
});
document.getElementById('navBack').addEventListener('click', () => GameManager.backToLobby());
</script>
