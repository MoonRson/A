<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>欢迎</title>
    <!-- 引入思源宋体（Noto Serif SC） -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
               全局基础样式
               ============================================================ */
        :root {
            --bg-color: #FAF6F0;
            --ink-color: 139, 125, 107;
            --text-primary: #3D3629;
            --line-decoration: #C5B8A5;
            --text-secondary: #8B7D6B;
            --text-tertiary: #A89888;
            --ripple-color: 190, 170, 150;
            --font-serif: 'Noto Serif SC', 'Songti SC', 'SimSun', serif;
            --slogan-size: clamp(1.3rem, 3.2vw, 2rem);
            --clock-size: clamp(0.9rem, 2vw, 1.15rem);
            --social-size: clamp(1rem, 2.2vw, 1.3rem);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: var(--font-serif);
            background-color: var(--bg-color);
            background-image:
                radial-gradient(ellipse at 20% 30%, rgba(255, 250, 240, 0.6) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, rgba(245, 238, 228, 0.5) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 50%, rgba(253, 250, 244, 0.4) 0%, transparent 70%);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            user-select: none;
            cursor: default;
        }

        #bg-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.035;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
            background-repeat: repeat;
            background-size: 200px 200px;
        }

        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            padding: 0 24px;
            pointer-events: none;
        }

        .slogan-container {
            display: flex;
            align-items: stretch;
            justify-content: center;
            pointer-events: auto;
        }

        .slogan-line-decoration {
            flex-shrink: 0;
            width: 2px;
            min-height: 100%;
            background: linear-gradient(to bottom,
                    transparent 0%,
                    var(--line-decoration) 12%,
                    var(--line-decoration) 88%,
                    transparent 100%);
            border-radius: 1px;
            margin-right: clamp(16px, 3vw, 32px);
            opacity: 0.75;
        }

        .slogan-text {
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: left;
        }

        .slogan-line {
            font-size: var(--slogan-size);
            font-weight: 400;
            color: var(--text-primary);
            line-height: 1.75;
            letter-spacing: 0.06em;
            white-space: nowrap;
            min-height: 1.75em;
            transition: color 0.4s ease;
        }

        .slogan-line .cursor {
            display: inline-block;
            width: 2px;
            height: 1.15em;
            background: var(--text-primary);
            margin-left: 3px;
            vertical-align: text-bottom;
            border-radius: 1px;
            animation: cursor-blink 1s step-end infinite;
            opacity: 1;
            transition: opacity 0.2s ease;
        }

        .slogan-line .cursor.hidden {
            opacity: 0;
            animation: none;
        }

        @keyframes cursor-blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .clock {
            margin-top: clamp(28px, 5vh, 48px);
            font-size: var(--clock-size);
            font-weight: 300;
            color: var(--text-secondary);
            letter-spacing: 0.12em;
            text-align: center;
            pointer-events: auto;
            transition: color 0.4s ease;
        }

        .social-links {
            margin-top: clamp(20px, 4vh, 36px);
            display: flex;
            gap: clamp(18px, 3vw, 32px);
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            flex-wrap: wrap;
        }

        .social-link {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: var(--social-size);
            color: var(--text-tertiary);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.3s ease, transform 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            padding: 4px;
            background: none;
            border: none;
            font-family: inherit;
        }

        .social-link:hover {
            color: var(--text-primary);
            transform: translateY(-2px);
        }

        .social-link::after {
            content: attr(data-label);
            position: absolute;
            bottom: calc(100% + 10px);
            left: 50%;
            transform: translateX(-50%) translateY(4px);
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--text-secondary);
            background: rgba(250, 246, 240, 0.92);
            border: 1px solid rgba(197, 184, 165, 0.5);
            border-radius: 6px;
            padding: 4px 10px;
            white-space: nowrap;
            letter-spacing: 0.04em;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease, transform 0.25s ease;
            box-shadow: 0 2px 8px rgba(61, 54, 41, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .social-link:hover::after {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .ripple {
            position: fixed;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(var(--ripple-color), 0.35);
            pointer-events: none;
            z-index: 4;
            transform: translate(-50%, -50%);
            animation: ripple-expand 1.6s cubic-bezier(0.22, 0.61, 0.36, 1) forwards;
        }

        @keyframes ripple-expand {
            0% {
                width: 0;
                height: 0;
                opacity: 0.45;
            }
            100% {
                width: 420px;
                height: 420px;
                opacity: 0;
            }
        }

        /* ============================================================
           响应式适配（移动端）
           ============================================================ */
        @media (max-width: 768px) {
            .content {
                padding: 0 16px;
            }

            .slogan-line-decoration {
                margin-right: 14px;
                width: 1.5px;
                opacity: 0.65;
            }

            .slogan-line {
                font-size: clamp(1.05rem, 4.5vw, 1.4rem);
                line-height: 1.7;
                letter-spacing: 0.04em;
                min-height: 1.7em;
            }

            .clock {
                font-size: clamp(0.8rem, 3vw, 1rem);
                letter-spacing: 0.1em;
                margin-top: 22px;
            }

            .social-links {
                gap: 14px;
                margin-top: 18px;
            }

            .social-link {
                font-size: clamp(0.95rem, 3.5vw, 1.15rem);
            }

            /* 移动端：彻底隐藏文字标签，只显示图标 */
            .social-link::after {
                display: none;
            }

            @keyframes ripple-expand {
                0% {
                    width: 0;
                    height: 0;
                    opacity: 0.4;
                }
                100% {
                    width: 280px;
                    height: 280px;
                    opacity: 0;
                }
            }
        }

        @media (max-width: 380px) {
            .slogan-line {
                font-size: 0.95rem;
                letter-spacing: 0.03em;
            }
            .social-links {
                gap: 10px;
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #F5F0E8;
                --text-primary: #3A342A;
            }
        }
    </style>
</head>
<body>

    <canvas id="bg-canvas"></canvas>
    <div class="noise-overlay" aria-hidden="true"></div>

    <div class="content" id="content">
        <div class="slogan-container">
            <div class="slogan-line-decoration" aria-hidden="true"></div>
            <div class="slogan-text" id="slogan-text">
                <div class="slogan-line" id="slogan-line-0">
                    <span class="typed-text" id="typed-0"></span><span class="cursor hidden" id="cursor-0"></span>
                </div>
                <div class="slogan-line" id="slogan-line-1">
                    <span class="typed-text" id="typed-1"></span><span class="cursor hidden" id="cursor-1"></span>
                </div>
                <div class="slogan-line" id="slogan-line-2">
                    <span class="typed-text" id="typed-2"></span><span class="cursor hidden" id="cursor-2"></span>
                </div>
            </div>
        </div>

        <div class="clock" id="clock">00:00:00 · 星期日</div>

        <div class="social-links">
            <a href="https://github.com/" target="_blank" rel="noopener noreferrer"
               class="social-link" data-label="GitHub" aria-label="GitHub">🌱</a>
            <a href="https://twitter.com/" target="_blank" rel="noopener noreferrer"
               class="social-link" data-label="Twitter" aria-label="Twitter">🕊️</a>
            <!-- 微信链接已改为微信官网 -->
            <a href="https://weixin.qq.com/" target="_blank" rel="noopener noreferrer"
               class="social-link" data-label="WeChat" aria-label="WeChat">💬</a>
            <a href="mailto:hello@example.com" class="social-link" data-label="Email" aria-label="Email">✉️</a>
            <button class="social-link" id="music-toggle" data-label="音乐" aria-label="播放或暂停背景音乐">🎵</button>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            // 一、Canvas 背景
            // ============================================================
            const canvas = document.getElementById('bg-canvas');
            const ctx = canvas.getContext('2d');

            let canvasWidth = window.innerWidth;
            let canvasHeight = window.innerHeight;

            const mouse = { x: -9999, y: -9999 };

            const INK_RGB = { r: 139, g: 125, b: 107 };
            const INK_COUNT = 10;
            const inkBlots = [];

            function initInkBlots() {
                inkBlots.length = 0;
                for (let i = 0; i < INK_COUNT; i++) {
                    const margin = 80;
                    const x = margin + Math.random() * (canvasWidth - margin * 2);
                    const y = margin + Math.random() * (canvasHeight - margin * 2);
                    const radius = 80 + Math.random() * 120;
                    const baseAlpha = 0.01 + Math.random() * 0.06;
                    const driftSpeed = 0.05 + Math.random() * 0.1;
                    const driftRange = 20 + Math.random() * 40;
                    const phase = Math.random() * Math.PI * 2;
                    const satelliteOffsets = [];
                    const satelliteCount = 2 + Math.floor(Math.random() * 2);
                    for (let s = 0; s < satelliteCount; s++) {
                        satelliteOffsets.push({
                            dx: (Math.random() - 0.5) * radius * 0.8,
                            dy: (Math.random() - 0.5) * radius * 0.8,
                            r: radius * (0.25 + Math.random() * 0.35),
                            alphaFactor: 0.3 + Math.random() * 0.5
                        });
                    }
                    inkBlots.push({
                        initialX: x,
                        initialY: y,
                        radius: radius,
                        baseAlpha: baseAlpha,
                        driftSpeed: driftSpeed,
                        driftRange: driftRange,
                        phase: phase,
                        satellites: satelliteOffsets,
                        alphaPulseSpeed: 0.15 + Math.random() * 0.25,
                        alphaPulseRange: 0.004 + Math.random() * 0.008
                    });
                }
            }

            const DUST_COUNT = 40;
            const dustParticles = [];

            function initDustParticles() {
                dustParticles.length = 0;
                for (let i = 0; i < DUST_COUNT; i++) {
                    dustParticles.push({
                        x: Math.random() * canvasWidth,
                        y: Math.random() * canvasHeight,
                        vx: (Math.random() - 0.5) * 0.3,
                        vy: (Math.random() - 0.5) * 0.3,
                        radius: 1 + Math.random() * 2,
                        alpha: 0.03 + Math.random() * 0.12,
                        floatPhase: Math.random() * Math.PI * 2,
                        floatSpeed: 0.2 + Math.random() * 0.5,
                        floatAmplitude: 0.15 + Math.random() * 0.35
                    });
                }
            }

            function resizeCanvas() {
                canvasWidth = window.innerWidth;
                canvasHeight = window.innerHeight;
                canvas.width = canvasWidth;
                canvas.height = canvasHeight;
                initInkBlots();
                initDustParticles();
            }

            window.addEventListener('resize', resizeCanvas);

            window.addEventListener('mousemove', function(e) {
                mouse.x = e.clientX;
                mouse.y = e.clientY;
            });

            window.addEventListener('mouseleave', function() {
                mouse.x = -9999;
                mouse.y = -9999;
            });

            window.addEventListener('touchmove', function(e) {
                if (e.touches.length > 0) {
                    mouse.x = e.touches[0].clientX;
                    mouse.y = e.touches[0].clientY;
                }
            }, { passive: true });

            window.addEventListener('touchend', function() {
                mouse.x = -9999;
                mouse.y = -9999;
            });

            function drawInkBlot(blot, time) {
                const dx = Math.sin(time * blot.driftSpeed + blot.phase) * blot.driftRange;
                const dy = Math.cos(time * blot.driftSpeed * 0.7 + blot.phase * 1.3) * blot.driftRange;
                const cx = blot.initialX + dx;
                const cy = blot.initialY + dy;
                const alphaPulse = Math.sin(time * blot.alphaPulseSpeed + blot.phase) * blot.alphaPulseRange;
                const currentAlpha = Math.max(0.005, Math.min(0.09, blot.baseAlpha + alphaPulse));

                const mainGradient = ctx.createRadialGradient(cx, cy, 0, cx, cy, blot.radius);
                mainGradient.addColorStop(0, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, ${currentAlpha})`);
                mainGradient.addColorStop(0.55, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, ${currentAlpha * 0.5})`);
                mainGradient.addColorStop(1, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, 0)`);
                ctx.fillStyle = mainGradient;
                ctx.beginPath();
                ctx.arc(cx, cy, blot.radius, 0, Math.PI * 2);
                ctx.fill();

                for (const sat of blot.satellites) {
                    const satX = cx + sat.dx;
                    const satY = cy + sat.dy;
                    const satAlpha = currentAlpha * sat.alphaFactor;
                    if (satAlpha <= 0.002) continue;
                    const satGradient = ctx.createRadialGradient(satX, satY, 0, satX, satY, sat.r);
                    satGradient.addColorStop(0, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, ${satAlpha})`);
                    satGradient.addColorStop(0.6, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, ${satAlpha * 0.4})`);
                    satGradient.addColorStop(1, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, 0)`);
                    ctx.fillStyle = satGradient;
                    ctx.beginPath();
                    ctx.arc(satX, satY, sat.r, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function updateAndDrawDustParticles(time) {
                for (const p of dustParticles) {
                    const floatX = Math.sin(time * p.floatSpeed + p.floatPhase) * p.floatAmplitude;
                    const floatY = Math.cos(time * p.floatSpeed * 0.8 + p.floatPhase * 1.2) * p.floatAmplitude;

                    const mouseDx = mouse.x - p.x;
                    const mouseDy = mouse.y - p.y;
                    const mouseDist = Math.sqrt(mouseDx * mouseDx + mouseDy * mouseDy);
                    if (mouseDist < 150 && mouseDist > 0.1) {
                        const force = (150 - mouseDist) / 150 * 0.015;
                        p.vx += (mouseDx / mouseDist) * force;
                        p.vy += (mouseDy / mouseDist) * force;
                    }

                    p.x += p.vx + floatX;
                    p.y += p.vy + floatY;
                    p.vx *= 0.995;
                    p.vy *= 0.995;

                    if (p.x < -10) p.x = canvasWidth + 10;
                    if (p.x > canvasWidth + 10) p.x = -10;
                    if (p.y < -10) p.y = canvasHeight + 10;
                    if (p.y > canvasHeight + 10) p.y = -10;

                    const dustGradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
                    dustGradient.addColorStop(0, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, ${p.alpha})`);
                    dustGradient.addColorStop(0.5, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, ${p.alpha * 0.3})`);
                    dustGradient.addColorStop(1, `rgba(${INK_RGB.r}, ${INK_RGB.g}, ${INK_RGB.b}, 0)`);
                    ctx.fillStyle = dustGradient;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            function animateCanvas(timestamp) {
                const time = timestamp / 1000;
                ctx.clearRect(0, 0, canvasWidth, canvasHeight);
                for (const blot of inkBlots) {
                    drawInkBlot(blot, time);
                }
                updateAndDrawDustParticles(time);
                requestAnimationFrame(animateCanvas);
            }

            // ============================================================
            // 二、Slogan 打字机效果
            // ============================================================
            const sloganLines = [
                '在长期主义之路上，',
                '与伟大格局观者同行，',
                '做时间的朋友。'
            ];

            const typedElements = [
                document.getElementById('typed-0'),
                document.getElementById('typed-1'),
                document.getElementById('typed-2')
            ];
            const cursorElements = [
                document.getElementById('cursor-0'),
                document.getElementById('cursor-1'),
                document.getElementById('cursor-2')
            ];

            let charCount = [0, 0, 0];

            const STATE = {
                TYPING_LINE_0: 'typing_line_0',
                PAUSE_AFTER_LINE_0: 'pause_after_line_0',
                TYPING_LINE_1: 'typing_line_1',
                PAUSE_AFTER_LINE_1: 'pause_after_line_1',
                TYPING_LINE_2: 'typing_line_2',
                PAUSE_FULL: 'pause_full',
                DELETING: 'deleting',
                PAUSE_EMPTY: 'pause_empty'
            };

            let currentState = STATE.TYPING_LINE_0;
            let currentTypingLine = 0;
            let currentDeletingLine = 2;

            const TYPE_SPEED = 130;
            const LINE_PAUSE_DURATION = 550;
            const FULL_PAUSE_DURATION = 1800;
            const DELETE_SPEED = 55;
            const EMPTY_PAUSE_DURATION = 700;

            let stateTimer = 0;
            let lastTypeTime = 0;
            let lastDeleteTime = 0;

            function updateSloganDisplay() {
                for (let i = 0; i < 3; i++) {
                    typedElements[i].textContent = sloganLines[i].substring(0, charCount[i]);
                }
            }

            function updateCursors() {
                for (let i = 0; i < 3; i++) {
                    if (currentState === STATE.TYPING_LINE_0 && i === 0) {
                        cursorElements[i].classList.remove('hidden');
                    } else if (currentState === STATE.TYPING_LINE_1 && i === 1) {
                        cursorElements[i].classList.remove('hidden');
                    } else if (currentState === STATE.TYPING_LINE_2 && i === 2) {
                        cursorElements[i].classList.remove('hidden');
                    } else if (currentState === STATE.DELETING && i === currentDeletingLine) {
                        cursorElements[i].classList.remove('hidden');
                    } else {
                        cursorElements[i].classList.add('hidden');
                    }
                }
            }

            function updateTypewriter(timestamp) {
                const now = timestamp;

                switch (currentState) {
                    case STATE.TYPING_LINE_0:
                    case STATE.TYPING_LINE_1:
                    case STATE.TYPING_LINE_2: {
                        const lineIndex =
                            currentState === STATE.TYPING_LINE_0 ? 0 :
                            currentState === STATE.TYPING_LINE_1 ? 1 : 2;
                        const fullText = sloganLines[lineIndex];
                        if (now - lastTypeTime >= TYPE_SPEED) {
                            if (charCount[lineIndex] < fullText.length) {
                                charCount[lineIndex]++;
                                lastTypeTime = now;
                                updateSloganDisplay();
                                updateCursors();
                            } else {
                                stateTimer = now;
                                if (lineIndex === 0) {
                                    currentState = STATE.PAUSE_AFTER_LINE_0;
                                } else if (lineIndex === 1) {
                                    currentState = STATE.PAUSE_AFTER_LINE_1;
                                } else {
                                    currentState = STATE.PAUSE_FULL;
                                }
                                updateCursors();
                            }
                        }
                        break;
                    }
                    case STATE.PAUSE_AFTER_LINE_0:
                        if (now - stateTimer >= LINE_PAUSE_DURATION) {
                            currentState = STATE.TYPING_LINE_1;
                            currentTypingLine = 1;
                            lastTypeTime = now;
                            updateCursors();
                        }
                        break;
                    case STATE.PAUSE_AFTER_LINE_1:
                        if (now - stateTimer >= LINE_PAUSE_DURATION) {
                            currentState = STATE.TYPING_LINE_2;
                            currentTypingLine = 2;
                            lastTypeTime = now;
                            updateCursors();
                        }
                        break;
                    case STATE.PAUSE_FULL:
                        if (now - stateTimer >= FULL_PAUSE_DURATION) {
                            currentState = STATE.DELETING;
                            currentDeletingLine = 2;
                            lastDeleteTime = now;
                            updateCursors();
                        }
                        break;
                    case STATE.DELETING: {
                        if (now - lastDeleteTime >= DELETE_SPEED) {
                            if (currentDeletingLine >= 0) {
                                if (charCount[currentDeletingLine] > 0) {
                                    charCount[currentDeletingLine]--;
                                    lastDeleteTime = now;
                                    updateSloganDisplay();
                                    updateCursors();
                                } else {
                                    currentDeletingLine--;
                                    lastDeleteTime = now;
                                    updateCursors();
                                    if (currentDeletingLine < 0) {
                                        currentState = STATE.PAUSE_EMPTY;
                                        stateTimer = now;
                                        updateCursors();
                                    }
                                }
                            }
                        }
                        break;
                    }
                    case STATE.PAUSE_EMPTY:
                        if (now - stateTimer >= EMPTY_PAUSE_DURATION) {
                            currentState = STATE.TYPING_LINE_0;
                            currentTypingLine = 0;
                            charCount = [0, 0, 0];
                            lastTypeTime = now;
                            updateSloganDisplay();
                            updateCursors();
                        }
                        break;
                }
            }

            function initTypewriter() {
                charCount = [0, 0, 0];
                currentState = STATE.TYPING_LINE_0;
                currentTypingLine = 0;
                currentDeletingLine = 2;
                lastTypeTime = 0;
                lastDeleteTime = 0;
                stateTimer = 0;
                updateSloganDisplay();
                updateCursors();
            }

            // ============================================================
            // 三、实时时钟
            // ============================================================
            const clockElement = document.getElementById('clock');
            const WEEKDAYS = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];

            function updateClock() {
                const now = new Date();
                const hours = String(now.getHours()).padStart(2, '0');
                const minutes = String(now.getMinutes()).padStart(2, '0');
                const seconds = String(now.getSeconds()).padStart(2, '0');
                const weekday = WEEKDAYS[now.getDay()];
                clockElement.textContent = `${hours}:${minutes}:${seconds} · ${weekday}`;
            }

            setInterval(updateClock, 250);
            updateClock();

            // ============================================================
            // 四、背景音乐
            // ============================================================
            const audio = new Audio('music.mp3');
            audio.loop = true;
            const toggleBtn = document.getElementById('music-toggle');
            let isMusicPlaying = false;

            toggleBtn.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();

                if (isMusicPlaying) {
                    audio.pause();
                    toggleBtn.textContent = '🎵';
                } else {
                    audio.play().then(() => {
                        toggleBtn.textContent = '🎶';
                    }).catch((err) => {
                        toggleBtn.textContent = '❌';
                        console.warn('音频播放失败:', err);
                        setTimeout(() => {
                            toggleBtn.textContent = '🎵';
                        }, 2000);
                    });
                }
                isMusicPlaying = !isMusicPlaying;
            });

            audio.addEventListener('ended', function() {
                if (isMusicPlaying) {
                    audio.play().catch(() => {});
                }
            });

            // ============================================================
            // 五、点击涟漪
            // ============================================================
            window.addEventListener('click', function(e) {
                createRipple(e.clientX, e.clientY);
            });

            window.addEventListener('touchstart', function(e) {
                if (e.touches.length > 0) {
                    createRipple(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: true });

            function createRipple(x, y) {
                const ripple = document.createElement('div');
                ripple.className = 'ripple';
                ripple.style.left = x + 'px';
                ripple.style.top = y + 'px';
                document.body.appendChild(ripple);
                ripple.addEventListener('animationend', function() {
                    ripple.remove();
                });
                setTimeout(function() {
                    if (ripple.parentNode) {
                        ripple.remove();
                    }
                }, 2000);
            }

            // ============================================================
            // 六、主循环
            // ============================================================
            function mainLoop(timestamp) {
                animateCanvas(timestamp);
                updateTypewriter(timestamp);
                requestAnimationFrame(mainLoop);
            }

            // ============================================================
            // 七、初始化
            // ============================================================
            function init() {
                resizeCanvas();
                initTypewriter();
                updateClock();
                requestAnimationFrame(mainLoop);
            }

            init();

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    lastTypeTime = 0;
                    lastDeleteTime = 0;
                }
            });

        })();
    </script>
</body>
</html>
